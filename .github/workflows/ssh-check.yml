  name: SSH connection check

  on:
    push:
      branches:
        - dev-deploy
      paths:
        - .github/workflows/ssh-check.yml

  permissions:
    contents: read

  jobs:
    ssh-check:
      name: Verify SSH and Docker access
      runs-on: ubuntu-latest
      timeout-minutes: 5

      env:
        SSH_HOST: ${{ vars.SSH_HOST }}
        SSH_USER: ${{ vars.SSH_USER }}
        SSH_PORT: ${{ vars.SSH_PORT }}
        DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}

      steps:
        - name: Validate repository variables
          shell: bash
          run: |
            set -Eeuo pipefail
            
            : "${SSH_HOST:?Missing repository variable SSH_HOST}"
            : "${SSH_USER:?Missing repository variable SSH_USER}"
            : "${SSH_PORT:?Missing repository variable SSH_PORT}"
            : "${DEPLOY_PATH:?Missing repository variable DEPLOY_PATH}"

        - name: Configure SSH
          shell: bash
          env:
            SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
            SSH_KNOWN_HOSTS_VALUE: ${{ secrets.SSH_KNOWN_HOSTS }}
          run: |
            set -Eeuo pipefail
            
            : "${SSH_PRIVATE_KEY:?Missing repository secret SSH_KEY}"
            : "${SSH_KNOWN_HOSTS_VALUE:?Missing repository secret SSH_KNOWN_HOSTS}"
            
            install -d -m 700 "$HOME/.ssh"
            
            printf '%s\n' "$SSH_PRIVATE_KEY" \
              | tr -d '\r' \
              > "$HOME/.ssh/deploy_key"
            
            printf '%s\n' "$SSH_KNOWN_HOSTS_VALUE" \
              | tr -d '\r' \
              > "$HOME/.ssh/known_hosts"
            
            chmod 600 \
              "$HOME/.ssh/deploy_key" \
              "$HOME/.ssh/known_hosts"
            
            ssh-keygen -y \
              -f "$HOME/.ssh/deploy_key" \
              > /dev/null

        - name: Verify server connection
          shell: bash
          run: |
            set -Eeuo pipefail
            
            ssh \
              -p "$SSH_PORT" \
              -i "$HOME/.ssh/deploy_key" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o ConnectTimeout=10 \
              "$SSH_USER@$SSH_HOST" \
              bash -s -- "$SSH_USER" "$DEPLOY_PATH" <<'REMOTE'
            set -Eeuo pipefail
            
            expected_user="$1"
            deploy_path="$2"
            actual_user="$(whoami)"
            
            test "$actual_user" = "$expected_user"
            test -d "$deploy_path"
            test -w "$deploy_path"
            
            docker info > /dev/null
            docker compose version
            
            printf '\nSSH check passed\nuser=%s\ndeploy_path=%s\n' \
              "$actual_user" \
              "$deploy_path"
            REMOTE
